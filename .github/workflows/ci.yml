# CI for the OCI node's infrastructure: OpenTofu, the k8s manifests and Helm
# values, and the operator scripts that apply them.
#
# The repository is private on GitHub Free: no branch protection and no
# GitHub secret scanning. This workflow is the only automated guard, so it
# checks what a reviewer cannot see by reading a diff - that a manifest is
# schema-valid, that a values file still renders, that the telemetry pipeline
# still strips PII, that no script writes to the wrong cluster or puts a
# secret on argv, and that no credential was committed.
#
# House style follows YehudaBriskman/portfolio_site's ci.yml: actions pinned
# by full commit SHA, read-only token, no persisted credentials, a timeout on
# every job, a `Classify changes` job and one `CI gate` that answers for the
# run. Every check is a script under tests/ or .github/scripts/ that runs the
# same way on a laptop; the jobs only install pinned tools and call them.
#
# Actions minutes are limited, so the jobs that cost real time (Helm,
# OpenTofu, Telemetry e2e) run only when classification selects them; the
# seconds-long ones always run.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push to a pull request makes the first run's answer worthless, so
# that run is cancelled. Pushes to main each get their own group (the run id)
# and are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which path-filtered jobs this change needs (.github/scripts/ci-classify.sh,
  # whose header has the rules). Full history so the diff comes from local
  # git; anything git cannot answer selects everything. Event fields reach the
  # script through env, never `${{ }}` inside `run:`.
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      helm: ${{ steps.classify.outputs.helm }}
      tofu: ${{ steps.classify.outputs.tofu }}
      telemetry: ${{ steps.classify.outputs.telemetry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        name: Select jobs from the changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ci-classify.sh

  # gitleaks over the commits this event adds: a pull request's base..head,
  # every intermediate commit included, and a push to main's before..after. A
  # secret committed and deleted two commits later is still published by the
  # merge. Redacted: the log names commit, file, line and rule, never the
  # value. The weekly full-history scan is secret-scan.yml.
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Its own step: $GITHUB_PATH reaches the steps after it, not itself.
      - name: Install gitleaks
        run: .github/scripts/secret-scan.sh install
      - name: No secrets in the new commits (gitleaks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: .github/scripts/secret-scan.sh scan

  # Every shell script, including the test stubs that have no .sh suffix, at
  # a pinned shellcheck: the runner image's copy changes version on its own.
  shell:
    name: Shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: .github/scripts/tools.sh install shellcheck
      - name: shellcheck
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git ls-files '*.sh' 'tests/stubs/*')
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"

  # kubeconform, strict, with pinned core and CRD schemas (tests/manifests.sh).
  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kubeconform
        run: .github/scripts/tools.sh install kubeconform
      - name: kubeconform
        run: tests/manifests.sh

  # Each values file rendered by its chart at the version the cluster runs
  # (tests/helm.sh; the versions are in the README's Helm table).
  helm:
    name: Helm
    needs: [classify]
    if: needs.classify.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm
        run: .github/scripts/tools.sh install helm
      - name: helm template
        run: tests/helm.sh

  # fmt and validate only: no backend, no credentials, no plan. The provider
  # comes from .terraform.lock.hcl, read-only, so a CI run can never move it.
  tofu:
    name: OpenTofu
    needs: [classify]
    if: needs.classify.outputs.tofu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tofu
        run: .github/scripts/tools.sh install tofu
      - name: tofu fmt
        run: tofu fmt -check -diff -recursive
      - name: tofu validate
        run: |
          set -Eeuo pipefail
          tofu init -backend=false -lockfile=readonly -input=false
          tofu validate

  # The deployed collector, Loki, Tempo and Alertmanager configs, run in
  # docker from the pinned images (tests/telemetry-e2e.sh): the token gate,
  # PII stripping and the token-reuse page. Measured ~40 s locally once the
  # images are pulled.
  telemetry:
    name: Telemetry e2e
    needs: [classify]
    if: needs.classify.outputs.telemetry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PyYAML for the config extraction
        run: python3 -I -c 'import yaml' || { sudo apt-get update -q && sudo apt-get install -y -q python3-yaml; }
      - name: Telemetry e2e
        run: tests/telemetry-e2e.sh

  # The operator scripts against stub kubectl/ssh/flyctl (tests/scripts.sh):
  # the wrong-cluster guard, the image migration, secrets kept off argv.
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Script tests
        run: tests/scripts.sh

  # The one answer for the run (.github/scripts/ci-gate.sh). A skipped job is
  # fine when classification did not select it; a failure, a cancellation, or
  # a skip classification did not ask for fails the gate.
  #
  # `always()`, not `!cancelled()`: a gate that is skipped when the run is
  # cancelled would read as a pass to anything that looks at it.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [classify, secrets, shell, manifests, helm, tofu, telemetry, scripts]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Every job passed, every skip was selected
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: >-
            helm=${{ needs.classify.outputs.helm || 'true' }}
            tofu=${{ needs.classify.outputs.tofu || 'true' }}
            telemetry=${{ needs.classify.outputs.telemetry || 'true' }}
        run: .github/scripts/ci-gate.sh
