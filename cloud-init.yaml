#cloud-config
# Rendered by Terraform templatefile(). Literal shell interpolations must be doubled.
timezone: Asia/Jerusalem
package_update: true
package_upgrade: true

# Tailscale comes from its own apt repository at a pinned version (#25), not
# from `curl https://tailscale.com/install.sh | sh` as root: that ran whatever
# the script said on the day, and installed whatever version it chose.
#
# The signing key is inline, so trust is anchored in this repository rather
# than fetched over the same connection as the packages. It is Tailscale's
# repository key, fingerprint 2596 A99E AAB3 3821 893C 0A79 458C A832 957F 5868,
# fetched 2026-11-04 from https://pkgs.tailscale.com/stable/ubuntu/noble.gpg.
# `noble` matches the Ubuntu 24.04 image in compute.tf; change both together.
#
# The version is pinned in `packages:` below. The repository keeps old builds
# (154 of them for noble/arm64 on 2026-11-04), so a pinned build stays
# installable. To bump it, list what exists and pick one:
#
#   curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/dists/noble/main/binary-arm64/Packages \
#     | awk '/^Package: tailscale$/{p=1} p&&/^Version:/{print $2; p=0}' | sort -V | tail -3
#
# On a running node, `apt-get install tailscale=<version>`: cloud-init only
# runs at first boot, and compute.tf ignores later changes to this file.
# unattended-upgrades only follows Ubuntu's own origins, so it never moves it.
