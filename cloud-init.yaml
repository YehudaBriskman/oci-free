packages:
  - [tailscale, "1.104.5"]
  - curl
  - ca-certificates
  - iptables-persistent
  - netfilter-persistent
  - unattended-upgrades
  - htop
  - jq
  - git

write_files:
  # Exit-node and subnet-router duty both require forwarding.
  - path: /etc/sysctl.d/99-tailscale.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1

  - path: /usr/local/sbin/oci-open-tailscale-ports.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Oracle's Ubuntu images ship an iptables ruleset that drops nearly everything
      # except port 22, independent of VCN security lists. This is the single most
      # common reason a service on an OCI box is unreachable.
      set -euo pipefail
      iptables -C INPUT -i tailscale0 -j ACCEPT 2>/dev/null || \
        iptables -I INPUT 1 -i tailscale0 -j ACCEPT
      iptables -C INPUT -p udp --dport 41641 -j ACCEPT 2>/dev/null || \
        iptables -I INPUT 1 -p udp --dport 41641 -j ACCEPT
      netfilter-persistent save

  # The guard (#18): pods cannot read the instance metadata (this user_data,
  # with the auth key), and tailnet peers reach only ports 22/80/443/6443.
  # Source: node/oci-free-guard.sh, node/oci-free-guard.service.
  - path: /usr/local/sbin/oci-free-guard
    permissions: '0755'
    content: |
      ${indent(6, guard_script)}
  - path: /etc/systemd/system/oci-free-guard.service
    content: |
      ${indent(6, guard_unit)}

runcmd:
  - sysctl --system
  - /usr/local/sbin/oci-open-tailscale-ports.sh
  - systemctl daemon-reload
  - systemctl enable --now oci-free-guard.service
  - |
    tailscale up \
      --authkey='${ts_authkey}' \
      --hostname='${ts_hostname}' \
      --ssh \
      %{ if ts_exit_node ~}--advertise-exit-node \
      %{ endif ~}--accept-dns=false
  # --accept-dns=false is deliberate: MagicDNS is disabled on this tailnet.
  - systemctl enable --now unattended-upgrades
  - |
    echo "cloud-init finished at $(date -Is)" > /var/log/oci-bootstrap-done
    tailscale ip -4 >> /var/log/oci-bootstrap-done 2>&1 || true

final_message: "bootstrap complete after $UPTIME seconds"
