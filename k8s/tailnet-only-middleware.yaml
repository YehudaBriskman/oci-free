# Restricts a route to Tailscale's CGNAT range (100.64.0.0/10).
# DNS alone is NOT a control -- Traefik routes on the Host header, so anyone could
# reach these by sending the header to the public IP. This enforces it at the proxy.
# Middlewares are namespaced, so one per namespace that needs it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: tailnet-only, namespace: monitoring}
spec:
  ipAllowList:
    sourceRange: ["100.64.0.0/10"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: tailnet-only, namespace: forgejo}
spec:
  ipAllowList:
    sourceRange: ["100.64.0.0/10"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: tailnet-only, namespace: obsidian}
spec:
  ipAllowList:
    sourceRange: ["100.64.0.0/10"]
---
# Preprod runs unreleased `main`. It is gated here rather than being public
# because an unreleased build of the site has no audience on the internet, and
# a second host serving the same pages is a duplicate-content problem the real
# site inherits. See k8s/portfolio-preprod.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: tailnet-only, namespace: preprod}
spec:
  ipAllowList:
    sourceRange: ["100.64.0.0/10"]
