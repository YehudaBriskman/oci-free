# Sized for a 2 OCPU / 12 GB Always Free A1 node.
# k3s bundles scheduler/controller-manager/etcd inside one process and does not
# expose their standalone metrics endpoints, so those scrape jobs are disabled --
# left on, they generate permanent false-positive TargetDown alerts.
kubeScheduler:         {enabled: false}
kubeControllerManager: {enabled: false}
kubeEtcd:              {enabled: false}
kubeProxy:             {enabled: false}

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits:   {memory: 1536Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources: {requests: {storage: 20Gi}}

alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits:   {memory: 192Mi}

grafana:
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits:   {memory: 384Mi}
  service:
    type: ClusterIP   # reached only through Traefik + oauth2-proxy

  # Identity comes from oauth2-proxy, so Grafana's own login form is redundant.
  # Traefik overwrites X-Auth-Request-Email from the auth response, so a client
  # cannot forge it -- verified by test, not assumed.
  grafana.ini:
    auth:
      disable_login_form: true
      signout_redirect_url: https://auth.yehudabriskman.com/oauth2/sign_out
    auth.proxy:
      enabled: true
      header_name: X-Auth-Request-Email
      header_property: email
      auto_sign_up: true
      sync_ttl: 60
      # Only the in-cluster pod network may assert identity headers.
      whitelist: 10.42.0.0/16
    auth.anonymous:
      enabled: false
    users:
      auto_assign_org_role: Admin

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits:   {memory: 256Mi}

kube-state-metrics:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits:   {memory: 192Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits:   {memory: 96Mi}
