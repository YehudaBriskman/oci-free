apiVersion: v1
kind: ConfigMap
metadata: {name: placeholder-html, namespace: prod}
data:
  index.html: |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>yehudabriskman.com</title>
    <style>
      :root{color-scheme:light dark}
      body{margin:0;min-height:100vh;display:grid;place-items:center;
           font:16px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
           background:#0d1117;color:#e6edf3}
      main{text-align:center;padding:2rem}
      h1{font-size:clamp(1.6rem,5vw,2.6rem);margin:0 0 .5rem;letter-spacing:-.02em}
      p{margin:.25rem 0;color:#8b949e}
      code{background:#161b22;padding:.15rem .4rem;border-radius:4px;font-size:.85em}
    </style></head>
    <body><main>
      <h1>yehudabriskman.com</h1>
      <p>Running on k3s — Oracle Cloud Ampere A1, Jerusalem.</p>
      <p><code>2 OCPU · 12 GB · always free</code></p>
    </main></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: placeholder, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: placeholder}}
  template:
    metadata: {labels: {app: placeholder}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {memory: 64Mi}
          volumeMounts:
            - {name: html, mountPath: /usr/share/nginx/html}
      volumes:
        - name: html
          configMap: {name: placeholder-html}
---
apiVersion: v1
kind: Service
metadata: {name: placeholder, namespace: prod}
spec:
  selector: {app: placeholder}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: placeholder
  namespace: prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: placeholder, port: {number: 80}}}}]}
    - host: www.yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: placeholder, port: {number: 80}}}}]}
