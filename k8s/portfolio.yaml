# Portfolio: static frontend (nginx) + contact-form API.
#
# Images come from GHCR, published by the site repository's CI on every push to
# main, multi-arch so the arm64 node can actually run them. The tag is rewritten
# per rollout by `kubectl set image` in that same pipeline, so what is committed
# here is a floor rather than what is running: `:latest` is what a fresh
# `kubectl apply` gets, and the live tag is a commit sha.
#
# This replaced `imagePullPolicy: Never` against images built on the node from a
# laptop's working directory. That arrangement could run code that was never
# committed -- and for six weeks it did -- and it had quietly stopped working
# altogether, because the rollout script still synced a frontend directory that
# had been renamed. The site was six weeks stale and nothing said so.
#
# The packages are private, so both deployments need `ghcr-pull`. Create it once:
#
#   kubectl -n prod create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<github-user> \
#     --docker-password=<PAT with read:packages>
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: web
          image: ghcr.io/yehudabriskman/portfolio_site/web:latest
          # Not Always: the pipeline sets an immutable sha tag, so there is
          # nothing to re-check on a restart, and Always would turn every pod
          # reschedule into a registry round trip the node does not need.
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits:   {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: prod}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: api
          image: ghcr.io/yehudabriskman/portfolio_site/api:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          envFrom:
            - secretRef: {name: portfolio-api-env}
          env:
            # Overrides NODE_ENV=development carried over from the local .env.
            - {name: NODE_ENV, value: production}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits:   {memory: 256Mi}
---
# The name "api" is load-bearing: the frontend's nginx.conf proxies /api/ to
# http://api:5000/api/, so this Service must keep that exact name in this namespace.
apiVersion: v1
kind: Service
metadata: {name: api, namespace: prod}
spec:
  selector: {app: api}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
    - host: www.yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
