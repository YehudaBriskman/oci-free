# Portfolio: static frontend (nginx) + contact-form API.
#
# Images come from GHCR, published by the site repository's CI on every push to
# main, multi-arch so the arm64 node can actually run them. CI owns the `image`
# field of `web` and `api`, and this file deliberately has none (#25).
#
# CI rolls out `<app>@sha256:...` from the release manifest it records in GHCR,
# with `kubectl set image`. When this file carried `image: ...:latest`, any
# `kubectl apply` of it put that tag back over CI's digest, because client-side
# apply diffs the file against the LIVE object, not against what it last
# applied. On 2026-11-04 an apply of the preprod manifest did exactly that, and
# preprod went back to the last release. No value written here can be right for
# longer than one CI run, so there is no value written here.
#
# What that costs, measured on a throwaway k3s 1.31:
#
# - `kubectl apply -f` of this file leaves the live image alone. Every other
#   field (env, probes, resources, pull secret) is still applied from here.
# - A Deployment cannot be CREATED without an image ("image: Required value").
#   `./k8s/portfolio-apply.sh prod` creates a missing one at `:latest` (the last
#   release) and then applies this file; CI's next deploy pins the digest.
# - A Deployment last applied from the old file still has `"image":` in its
#   last-applied annotation, and a plain apply then tries to delete the field,
#   which the API server refuses (nothing changes, the apply errors).
#   `portfolio-apply.sh` drops that stale annotation once; after that a plain
#   `kubectl apply -f` is safe.
#
# What is running: `kubectl -n prod get deploy web api -o wide`, and the
# `portfolio.yehudabriskman.com/source-sha` annotation CI writes.
#
# This replaced `imagePullPolicy: Never` against images built on the node from a
# laptop's working directory. That arrangement could run code that was never
# committed -- and for six weeks it did -- and it had quietly stopped working
# altogether, because the rollout script still synced a frontend directory that
# had been renamed. The site was six weeks stale and nothing said so.
#
# The packages are private, so both deployments need `ghcr-pull`. Create it once:
#
#   kubectl -n prod create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<github-user> \
#     --docker-password=<PAT with read:packages>
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: web
          # No `image:` on purpose; CI owns it. See the header.
          # Not Always: the pipeline sets an immutable digest, so there is
          # nothing to re-check on a restart, and Always would turn every pod
          # reschedule into a registry round trip the node does not need.
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            # The API's host, fully qualified, and the qualification is the
            # entire reason this variable exists.
            #
            # nginx.conf.template proxies every /api/ request and all four
            # rendered SEO routes through one `set $api_upstream` line,
            # resolved per request by `resolver`. nginx takes nameservers from
            # /etc/resolv.conf and ignores its `search` list entirely, so the
            # bare Service name `api` is looked up as an absolute name, has no
            # record, and every /api/ request answers 502 with
            # `api could not be resolved (3: Host not found)`. A shell in the
            # same pod resolves `api` because libc appends the search domains;
            # nginx never does. Measured in preprod: 502 through nginx against
            # 200 for the identical path straight at the api Service.
            #
            # The image defaults this to `api`, which is correct under Docker
            # Compose and wrong here, so it is set per namespace rather than
            # baked in. `.prod.` and not `.preprod.` — the namespace is part of
            # the name, and getting it wrong here points production's frontend
            # at preprod's API.
            - {name: NGINX_API_HOST, value: api.prod.svc.cluster.local}
            # Drop X-Auth-Request-User, X-Auth-Request-Email and
            # X-Admin-Proxy-Secret on the way to the API (oci-free #22). Safe
            # here and only here: the admin host's /api goes straight to the
            # api Service (k8s/admin-gate.template.yaml) and never passes this
            # nginx, so nothing legitimate reaches it carrying them. Preprod
            # must NOT set this: its admin gate runs in front of its nginx.
            # An image from before the switch ignores the variable.
            - {name: NGINX_FORWARD_IDENTITY, value: "off"}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits:   {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: prod}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: api
          # No `image:` on purpose; CI owns it. See the header.
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          envFrom:
            - secretRef: {name: portfolio-api-env}
          env:
            # Overrides NODE_ENV=development carried over from the local .env.
            - {name: NODE_ENV, value: production}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits:   {memory: 512Mi}
---
# The name "api" is load-bearing: the frontend's nginx.conf proxies /api/ to
# port 5000 on it, so this Service must keep that exact name in this namespace.
# The frontend reaches it by its fully-qualified name — see NGINX_API_HOST on
# the web Deployment above for why a bare `api` cannot work from nginx — which
# means renaming this Service or moving it to another namespace now breaks that
# variable too, not just the name.
apiVersion: v1
kind: Service
metadata: {name: api, namespace: prod}
spec:
  selector: {app: api}
  ports: [{port: 5000, targetPort: 5000}]
---
# Remove anything the CLIENT claims about its identity before the request goes
# any further (oci-free #22). The public host has no auth step, so on this
# Ingress nothing legitimate ever carries these three; the API's requireAdmin
# would refuse them anyway, since a client never knows the proxy secret, but
# that should not be the only thing saying no.
#
# Also the admin gate's first step: the admin Ingress
# (k8s/admin-gate.template.yaml) names prod-strip-identity before github-auth.
# It is declared here, in the file every install applies first, and the
# template refers to it rather than declaring a second copy that could drift.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: strip-identity, namespace: prod}
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
      X-Admin-Proxy-Secret: ""
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Namespaced, hence the `prod-` prefix; defined just above.
    traefik.ingress.kubernetes.io/router.middlewares: prod-strip-identity@kubernetescrd
spec:
  rules:
    - host: yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
    - host: www.yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
