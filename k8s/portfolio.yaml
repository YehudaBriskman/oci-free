# Portfolio: static frontend (nginx) + contact-form API.
# Images are built natively on the ARM node and imported into k3s containerd, so
# imagePullPolicy MUST be Never -- otherwise kubelet tries to pull from Docker Hub
# and fails, since these images exist nowhere but this node.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: portfolio-web:latest
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits:   {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: prod}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: portfolio-api:latest
          imagePullPolicy: Never
          ports: [{containerPort: 5000}]
          envFrom:
            - secretRef: {name: portfolio-api-env}
          env:
            # Overrides NODE_ENV=development carried over from the local .env.
            - {name: NODE_ENV, value: production}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits:   {memory: 256Mi}
---
# The name "api" is load-bearing: the frontend's nginx.conf proxies /api/ to
# http://api:5000/api/, so this Service must keep that exact name in this namespace.
apiVersion: v1
kind: Service
metadata: {name: api, namespace: prod}
spec:
  selector: {app: api}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
    - host: www.yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
