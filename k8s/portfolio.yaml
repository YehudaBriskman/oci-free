# Portfolio: static frontend (nginx) + contact-form API.
#
# Images come from GHCR, published by the site repository's CI on every push to
# main, multi-arch so the arm64 node can actually run them. The tag is rewritten
# per rollout by `kubectl set image` in that same pipeline, so what is committed
# here is a floor rather than what is running: `:latest` is what a fresh
# `kubectl apply` gets, and the live tag is a commit sha.
#
# This replaced `imagePullPolicy: Never` against images built on the node from a
# laptop's working directory. That arrangement could run code that was never
# committed -- and for six weeks it did -- and it had quietly stopped working
# altogether, because the rollout script still synced a frontend directory that
# had been renamed. The site was six weeks stale and nothing said so.
#
# The packages are private, so both deployments need `ghcr-pull`. Create it once:
#
#   kubectl -n prod create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<github-user> \
#     --docker-password=<PAT with read:packages>
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: prod}
spec:
  # Two, so a crash or an eviction is not an outage (#35). nginx serving a
  # baked bundle holds nothing between requests; 2 x 32Mi requested.
  replicas: 2
  # A rollout adds the new pod and waits for its readiness probe before it
  # removes an old one, so there is never a moment with fewer than two ready.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      # One node today, so this changes nothing yet. ScheduleAnyway rather than
      # DoNotSchedule, or the second replica would sit Pending on one node.
      # When a second node joins, new pods spread over the two by themselves.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: web}}
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: web
          image: ghcr.io/yehudabriskman/portfolio_site/web:latest
          # Not Always: the pipeline sets an immutable sha tag, so there is
          # nothing to re-check on a restart, and Always would turn every pod
          # reschedule into a registry round trip the node does not need.
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            # The API's host, fully qualified, and the qualification is the
            # entire reason this variable exists.
            #
            # nginx.conf.template proxies every /api/ request and all four
            # rendered SEO routes through one `set $api_upstream` line,
            # resolved per request by `resolver`. nginx takes nameservers from
            # /etc/resolv.conf and ignores its `search` list entirely, so the
            # bare Service name `api` is looked up as an absolute name, has no
            # record, and every /api/ request answers 502 with
            # `api could not be resolved (3: Host not found)`. A shell in the
            # same pod resolves `api` because libc appends the search domains;
            # nginx never does. Measured in preprod: 502 through nginx against
            # 200 for the identical path straight at the api Service.
            #
            # The image defaults this to `api`, which is correct under Docker
            # Compose and wrong here, so it is set per namespace rather than
            # baked in. `.prod.` and not `.preprod.` — the namespace is part of
            # the name, and getting it wrong here points production's frontend
            # at preprod's API.
            - {name: NGINX_API_HOST, value: api.prod.svc.cluster.local}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits:   {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: prod}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: prod}
spec:
  # Two, because the API keeps no state a second copy could disagree with
  # (#35, read from portfolio_site at 546365a):
  #  - every record, the media library included, is in CouchDB; the only local
  #    files are read-only images baked into the image (images.service.ts);
  #  - the remote MCP transport is stateless (sessionIdGenerator: undefined,
  #    mcp/router.ts), its OAuth state is CouchDB documents, and its tickets
  #    never leave the process that issued them (mcp/internal.ts);
  #  - the in-memory maps are caches that refill themselves (og.ts PNGs, the
  #    contribution year, the SEO shell) or write throttles (lastUsedAt);
  #  - the 15-minute GitHub stats refresh runs in each pod, and that is
  #    harmless: it re-puts the same documents, and CouchDB's revision check
  #    turns a collision into a 409 that the next tick retries.
  # The one cost: express-rate-limit counts in memory, per pod, so a client
  # spread across both can get up to twice each limit (contact form 5 -> 10
  # sends per 15 minutes; bearer failures 10 -> 20, against 256-bit tokens).
  # A shared store is the fix if that ever matters.
  #
  # Memory: limits are 512Mi each, three pods at most during a rollout, so
  # 1.5Gi in the worst case on a 12 GB node; requests stay at 64Mi each.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: api}}
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: api
          image: ghcr.io/yehudabriskman/portfolio_site/api:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          envFrom:
            - secretRef: {name: portfolio-api-env}
          env:
            # Overrides NODE_ENV=development carried over from the local .env.
            - {name: NODE_ENV, value: production}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits:   {memory: 512Mi}
          # Without one, a new pod took traffic the moment its container
          # started, before Express was listening, and maxUnavailable: 0 would
          # gate on nothing. /health and not /health/ready: ready also asks
          # CouchDB, and a store outage must not pull every API pod out of the
          # Service, since /api/email and the crawler files work without it.
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 2
            periodSeconds: 5
---
# The name "api" is load-bearing: the frontend's nginx.conf proxies /api/ to
# port 5000 on it, so this Service must keep that exact name in this namespace.
# The frontend reaches it by its fully-qualified name — see NGINX_API_HOST on
# the web Deployment above for why a bare `api` cannot work from nginx — which
# means renaming this Service or moving it to another namespace now breaks that
# variable too, not just the name.
apiVersion: v1
kind: Service
metadata: {name: api, namespace: prod}
spec:
  selector: {app: api}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
    - host: www.yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
---
# At most one of each may be evicted at a time (#35). A voluntary disruption
# (a drain, a k3s upgrade) then always leaves one ready pod serving.
#
# On this single node that has a consequence worth knowing before you need it:
# `kubectl drain` evicts one pod of each, cannot place the replacement on the
# cordoned node, and then waits on the second for as long as you let it. Drain
# with a --timeout, or accept the outage a one-node drain is anyway and run it
# with --disable-eviction.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: web, namespace: prod}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: web}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: prod}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: api}}
