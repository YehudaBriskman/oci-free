       },
       "gridPos": {
        "h": 7,
        "w": 8,
        "x": 8,
        "y": 15
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "lineWidth": 1,
          "fillOpacity": 5
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}[5m]))",
         "legendFormat": "{{pod}}"
        }
       ],
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 10,
       "type": "timeseries",
       "title": "CPU throttled, % of periods",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 7,
        "w": 8,
        "x": 16,
        "y": 15
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "min": 0,
         "max": 100,
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 25
           }
          ]
         },
         "custom": {
          "thresholdsStyle": {
           "mode": "line"
          },
          "lineWidth": 1,
          "fillOpacity": 5
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pod, container) (increase(container_cpu_cfs_throttled_periods_total{namespace=~\"$namespace\",container!=\"\"}[5m])) / sum by (pod, container) (increase(container_cpu_cfs_periods_total{namespace=~\"$namespace\",container!=\"\"}[5m])) * 100",
         "legendFormat": "{{pod}} / {{container}}"
        }
       ],
       "description": "PodCPUThrottled fires above 25% (red line) for 15m.",
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 11,
       "type": "timeseries",
       "title": "Restarts in the last hour",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 7,
        "w": 8,
        "x": 0,
        "y": 22
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 3
           }
          ]
         },
         "custom": {
          "thresholdsStyle": {
           "mode": "line"
          },
          "lineWidth": 1,
          "fillOpacity": 5
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]))",
         "legendFormat": "{{pod}} / {{container}}"
        }
       ],
       "description": "PodRestartingOften fires above 3 (red line).",
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 12,
       "type": "stat",
       "title": "Unavailable replicas",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 7,
        "w": 4,
        "x": 8,
        "y": 22
       },
       "fieldConfig": {
        "defaults": {
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(kube_deployment_status_replicas_unavailable{namespace=~\"$namespace\"})",
         "legendFormat": "unavailable"
        }
       ],
       "options": {
        "colorMode": "value",
        "graphMode": "none",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       }
      },
      {
       "id": 13,
       "type": "timeseries",
       "title": "PVC usage, % (every namespace)",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 7,
        "w": 12,
        "x": 12,
        "y": 22
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "min": 0,
         "max": 100,
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "#EAB839",
            "value": 70
           },
           {
            "color": "red",
            "value": 90
           }
          ]
         },
         "custom": {
          "thresholdsStyle": {
           "mode": "line"
          },
          "lineWidth": 1,
          "fillOpacity": 5
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100",
         "legendFormat": "{{persistentvolumeclaim}}"
        }
       ],
       "description": "Amber 70%, red 90%. Empty if the kubelet does not report stats for local-path volumes; see the node disk panels on 'Node: oci-free'.",
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 14,
       "type": "row",
       "title": "Edge and certificates",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 29
       },
       "panels": []
      },
      {
       "id": 15,
       "type": "timeseries",
       "title": "Traefik requests / s by service",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 7,
        "w": 8,
        "x": 0,
        "y": 30
       },
       "fieldConfig": {
        "defaults": {
