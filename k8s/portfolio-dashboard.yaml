      {
       "id": 17,
       "type": "timeseries",
       "title": "Traefik p95 latency by service",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 7,
        "w": 8,
        "x": 16,
        "y": 30
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "min": 0,
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 2
           }
          ]
         },
         "custom": {
          "thresholdsStyle": {
           "mode": "line"
          },
          "lineWidth": 1,
