          "fillOpacity": 5
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"})",
         "legendFormat": "{{pod}}"
        }
       ],
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 9,
       "type": "timeseries",
