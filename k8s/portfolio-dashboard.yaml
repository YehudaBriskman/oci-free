        }
       ],
       "description": "From the Traefik PodMonitor (k8s/portfolio-scrapes.yaml). Per service, not per host. Not filtered by the namespace variable.",
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 16,
       "type": "timeseries",
       "title": "Traefik 5xx, % of requests",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
