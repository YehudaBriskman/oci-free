# The portfolio Grafana dashboard (#54). Grafana's sidecar loads any ConfigMap
# labelled grafana_dashboard=1 (same mechanism as windom-dashboard.yaml). Edit
# the JSON here, not in the UI (editable is off so the two cannot drift). The
# `namespace` variable switches the container panels between prod, preprod and
# staging; the amber and red lines on usage panels are the 70% / 90% alert
# thresholds in portfolio-alerts.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-dashboard
  namespace: monitoring
  labels: {grafana_dashboard: "1"}
data:
  portfolio.json: |
    {
     "uid": "portfolio-overview",
     "title": "Portfolio: site, preprod, prod",
     "tags": [
      "portfolio"
     ],
     "timezone": "browser",
     "schemaVersion": 39,
     "editable": false,
     "refresh": "1m",
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "templating": {
      "list": [
       {
        "name": "namespace",
        "label": "Namespace",
        "type": "custom",
        "query": "prod,preprod,staging",
        "current": {
         "selected": true,
         "text": "prod",
         "value": "prod"
        },
        "options": [
         {
          "selected": true,
          "text": "prod",
          "value": "prod"
         },
         {
          "selected": false,
          "text": "preprod",
          "value": "preprod"
         },
         {
          "selected": false,
          "text": "staging",
          "value": "staging"
         }
        ],
        "multi": false,
        "includeAll": false
       }
      ]
     },
     "annotations": {
      "list": []
     },
     "panels": [
      {
       "id": 1,
       "type": "row",
       "title": "Uptime (Blackbox probes)",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 0
       },
       "panels": []
      },
      {
       "id": 2,
       "type": "stat",
       "title": "Probes up",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 5,
        "w": 4,
        "x": 0,
        "y": 1
       },
       "fieldConfig": {
        "defaults": {
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(probe_success)",
         "legendFormat": "up"
        },
        {
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "count(probe_success) - sum(probe_success)",
         "legendFormat": "down"
        }
       ],
       "description": "Targets answering as expected, from k8s/blackbox.yaml.",
       "options": {
        "colorMode": "value",
        "graphMode": "none",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       }
      },
      {
       "id": 3,
       "type": "table",
       "title": "Probe status",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 5,
        "w": 12,
        "x": 4,
        "y": 1
       },
       "fieldConfig": {
        "defaults": {
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "red",
            "value": null
           },
           {
            "color": "green",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "probe_success",
         "legendFormat": ""
        }
       ],
       "description": "1 = the target answered as expected.",
       "transformations": [
        {
         "id": "labelsToFields",
         "options": {
          "mode": "columns"
         }
        },
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true,
           "job": true,
           "endpoint": true,
           "namespace": true,
           "pod": true,
           "service": true,
           "container": true,
           "prometheus": true
          },
          "renameByName": {
           "Value": "up"
          }
         }
        }
       ],
       "options": {
        "cellHeight": "sm"
       }
      },
      {
       "id": 4,
       "type": "timeseries",
       "title": "Probe latency",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 5,
        "w": 8,
        "x": 16,
        "y": 1
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 2
           }
          ]
         },
         "custom": {
          "thresholdsStyle": {
           "mode": "line"
          },
          "lineWidth": 1,
          "fillOpacity": 5
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "probe_duration_seconds",
         "legendFormat": "{{instance}}"
        }
       ],
       "description": "Alert PortfolioProbeSlow fires above 2s for 10m (red line).",
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 5,
       "type": "row",
       "title": "Containers, namespace: $namespace",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 6
       },
       "panels": []
      },
      {
       "id": 6,
       "type": "timeseries",
       "title": "Pod memory, % of limit",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 0,
        "y": 7
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "min": 0,
         "max": 100,
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "#EAB839",
            "value": 70
           },
           {
            "color": "red",
            "value": 90
           }
          ]
         },
         "custom": {
          "thresholdsStyle": {
           "mode": "line"
          },
          "lineWidth": 1,
          "fillOpacity": 5
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pod, container) (container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}) / on (pod, container) kube_pod_container_resource_limits{namespace=~\"$namespace\",resource=\"memory\"} * 100",
         "legendFormat": "{{pod}} / {{container}}"
        }
       ],
       "description": "Amber line 70% (warning), red line 90% (critical). Containers with no memory limit are not shown.",
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 7,
       "type": "timeseries",
       "title": "Pod CPU, % of limit",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 12,
        "y": 7
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "min": 0,
         "max": 100,
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "#EAB839",
            "value": 70
           },
           {
            "color": "red",
            "value": 90
           }
          ]
         },
         "custom": {
          "thresholdsStyle": {
           "mode": "line"
          },
          "lineWidth": 1,
          "fillOpacity": 5
         }
        },
        "overrides": []
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}[5m])) / on (pod, container) kube_pod_container_resource_limits{namespace=~\"$namespace\",resource=\"cpu\"} * 100",
         "legendFormat": "{{pod}} / {{container}}"
        }
       ],
       "description": "Amber line 70%, red line 90%. Only containers with a CPU limit are shown; the next panel covers the rest.",
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 8,
       "type": "timeseries",
       "title": "Pod memory working set",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "h": 7,
