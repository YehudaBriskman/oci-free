# New scrapes for the portfolio alerts (#54): nothing in the chart's defaults
# collects these two. Both are labelled `release: kube-prometheus-stack`, the
# chart's selector. If a target does not appear in Prometheus afterwards, the
# alerts that need it stay silent (docs/monitoring.md, "What needs what").
#
# Traefik (k3s's bundled chart) serves Prometheus metrics on the container
# port named `metrics`; k8s/traefik-config.yaml does not turn them off.
# Labels are per service/router, not per Host header.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
  namespace: kube-system
  labels: {release: kube-prometheus-stack}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: traefik}}
  namespaceSelector: {matchNames: [kube-system]}
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
# cert-manager's controller: certificate expiry and readiness. The metrics are
# on by default, on container port 9402 named `http-metrics` in the upstream
# chart. A PodMonitor does not depend on the Service's port name (the Service's
# is `tcp-prometheus-servicemonitor`; the old ServiceMonitor here named a port
# that does not exist, so 0 series, #56).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
  labels: {release: kube-prometheus-stack}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: cert-manager, app.kubernetes.io/component: controller}
  namespaceSelector: {matchNames: [cert-manager]}
  podMetricsEndpoints:
    - port: http-metrics
      interval: 60s
