# Native arm64 CI. Registers against the in-cluster service URL, not the public
# hostname, so CI keeps working regardless of DNS or ingress state.
#
# Every image here is pinned by digest (#25): the runner, the dind daemon, and
# the two job images in --labels. A tag is a pointer the publisher can move, so
# `docker:27-dind` meant "whatever was pushed last", and the job images run
# every workflow's code with the dind socket in reach. Each digest is the
# MULTI-ARCH INDEX, not the arm64 manifest, so the node still picks its own
# platform; the tag stays in front of the `@` for the reader and is ignored by
# the pull. Resolved 2026-11-04 with:
#
#   docker buildx imagetools inspect <image:tag>    # the top-level "Digest:"
#
# To bump one: inspect the new tag, replace both halves, apply. The job images
# are read only at registration, which runs whenever /data (an emptyDir) is
# fresh, i.e. on every new pod: `kubectl -n forgejo rollout restart
# deploy/forgejo-runner` after an apply that only changes --labels.
#
# The Docker API (#17). dind is privileged, so whoever can talk to its daemon
# is root on the node. It used to listen on tcp://0.0.0.0:2375 with no TLS and
# no auth, reachable from every job container (via the bridge gateway) and
# every pod. Now it listens only on a unix socket in an emptyDir shared with
# the runner container, so nothing outside this pod has a path to it:
#   - dind's args start with `dockerd`. Without that, the image's entrypoint
#     adds --host=tcp://0.0.0.0:2375 itself (dockerd-entrypoint.sh).
#   - The runner's config sets docker_host "-": job containers do NOT get the
#     socket mounted, privileged is off, and no host volumes are allowed.
#   - The NetworkPolicy at the end refuses all ingress to this pod.
# Consequence: a workflow cannot `docker build` against the daemon. None do
# today (the site builds its images on GitHub Actions); add a rootless
# builder (e.g. buildah) to the job image if one ever needs to.
apiVersion: v1
kind: ConfigMap
metadata: {name: forgejo-runner-config, namespace: forgejo}
data:
  config.yaml: |
    log: {level: info}
    runner:
      file: .runner
      capacity: 1
      timeout: 3h
    container:
      network: ""
      privileged: false
      options: ""
      # "-": find the daemon from DOCKER_HOST, but never mount it into jobs.
      docker_host: "-"
      valid_volumes: []
      force_pull: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: forgejo-runner, namespace: forgejo}
spec:
  replicas: 1
  selector: {matchLabels: {app: forgejo-runner}}
  strategy: {type: Recreate}
  template:
    metadata: {labels: {app: forgejo-runner}}
    spec:
      initContainers:
        - name: register
          image: code.forgejo.org/forgejo/runner:6.3.1@sha256:5071e6832313bafe71577e05631bece88caff08fcfb372193e4a21941f4ed54b
          command: ["sh","-c"]
          args:
            - |
              set -e
              if [ -f /data/.runner ]; then echo "already registered"; exit 0; fi
              forgejo-runner register --no-interactive \
                --instance http://forgejo-http.forgejo.svc.cluster.local:3000 \
                --token "$RUNNER_TOKEN" \
                --name oci-arm-runner \
                --labels docker:docker://node:22-bookworm@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd,ubuntu-latest:docker://catthehacker/ubuntu:act-22.04@sha256:3488f78aa97770c8d5d835f2913c1a782d3121ad3f2aafb17054fb1d554ea4e1
          env:
            - name: RUNNER_TOKEN
              valueFrom: {secretKeyRef: {name: forgejo-runner-token, key: token}}
          workingDir: /data
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1@sha256:5071e6832313bafe71577e05631bece88caff08fcfb372193e4a21941f4ed54b
          # dind takes a few seconds to listen; without this the daemon starts first,
          # fails to reach the socket, and the container crashloops.
          command: ["sh","-c"]
          args:
            - |
              for i in $(seq 1 90); do
                [ -S /run/dind/docker.sock ] && break
                sleep 2
              done
              exec forgejo-runner daemon --config /config/config.yaml
          workingDir: /data
          env:
            - {name: DOCKER_HOST, value: "unix:///run/dind/docker.sock"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: dind-sock, mountPath: /run/dind}
            - {name: config, mountPath: /config, readOnly: true}
        - name: dind
          image: docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
          securityContext: {privileged: true}
          # The runner is uid 1000, gid 0, so the socket is group root, mode 0660.
          args: ["dockerd", "--host=unix:///run/dind/docker.sock", "--group=root"]
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits:   {memory: 1Gi}
          volumeMounts:
            - {name: dind-storage, mountPath: /var/lib/docker}
            - {name: dind-sock, mountPath: /run/dind}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: dind-storage, emptyDir: {}}
        - {name: dind-sock, emptyDir: {}}
        - {name: config, configMap: {name: forgejo-runner-config}}
---
# Nothing connects TO the runner: it polls Forgejo and talks to its own dind
# over the socket. So no ingress at all (#17). Egress stays open: jobs fetch
# from the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: forgejo-runner-no-ingress, namespace: forgejo}
spec:
  podSelector: {matchLabels: {app: forgejo-runner}}
  policyTypes: [Ingress]
