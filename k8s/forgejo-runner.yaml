# Native arm64 CI. Registers against the in-cluster service URL, not the public
# hostname, so CI keeps working regardless of DNS or ingress state.
apiVersion: apps/v1
kind: Deployment
metadata: {name: forgejo-runner, namespace: forgejo}
spec:
  replicas: 1
  selector: {matchLabels: {app: forgejo-runner}}
  strategy: {type: Recreate}
  template:
    metadata: {labels: {app: forgejo-runner}}
    spec:
      initContainers:
        - name: register
          image: code.forgejo.org/forgejo/runner:6.3.1
          command: ["sh","-c"]
          args:
            - |
              set -e
              if [ -f /data/.runner ]; then echo "already registered"; exit 0; fi
              forgejo-runner register --no-interactive \
                --instance http://forgejo-http.forgejo.svc.cluster.local:3000 \
                --token "$RUNNER_TOKEN" \
                --name oci-arm-runner \
                --labels docker:docker://node:22-bookworm,ubuntu-latest:docker://catthehacker/ubuntu:act-22.04
          env:
            - name: RUNNER_TOKEN
              valueFrom: {secretKeyRef: {name: forgejo-runner-token, key: token}}
          workingDir: /data
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          # dind takes a few seconds to listen; without this the daemon starts first,
          # fails to reach the socket, and the container crashloops.
          command: ["sh","-c"]
          args:
            - |
              for i in $(seq 1 90); do
                nc -z localhost 2375 2>/dev/null && break
                sleep 2
              done
              exec forgejo-runner daemon
          workingDir: /data
          env:
            - {name: DOCKER_HOST, value: "tcp://localhost:2375"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /data}]
        - name: dind
          image: docker:27-dind
          securityContext: {privileged: true}
          env:
            - {name: DOCKER_TLS_CERTDIR, value: ""}
          args: ["--host=tcp://0.0.0.0:2375","--tls=false"]
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits:   {memory: 1Gi}
          volumeMounts: [{name: dind-storage, mountPath: /var/lib/docker}]
      volumes:
        - {name: data, emptyDir: {}}
        - {name: dind-storage, emptyDir: {}}
