# Preprod: whatever is on `main` right now, somewhere it can be looked at.
#
# Releasing is a decision in this setup -- a merge to `main` builds and
# publishes, and only a `v*` tag rolls out to `prod`. That is the right trade
# for a live site and it leaves a gap: between a merge and a tag there is
# nowhere to see the merged work running. This namespace is that somewhere. CI
# rolls every push to `main` out here, by commit sha, with the same preflight,
# the same rollout-status reporting and the same curl-then-undo check the
# production rollout has.
#
# It is the same shape as prod on purpose -- same image, same nginx, same
# NODE_ENV, same Service names -- because a preprod that differs in shape only
# tells you about itself. Three things differ, and each one is a decision:
#
# 1. WHO CAN REACH IT -- whoever can sign in, and nobody else.
#    Unreleased work on a personal site does not belong on the public internet,
#    and the damage is not only who reads it: Google indexes a second host
#    serving the same content, which is a duplicate-content problem the site
#    lives with long after the build is gone.
#
#    This began as the house pattern for `git.` and `couchdb.` -- a Traefik
#    `ipAllowList` on 100.64.0.0/10 -- and that pattern does not work on this
#    cluster and never has. k3s's ServiceLB masquerades every inbound
#    connection, so Traefik receives a cluster address rather than the
#    client's. Measured from a laptop at 100.108.35.26 on the tailnet, through
#    a throwaway `whoami` behind this very Ingress:
#
#        RemoteAddr:      10.42.0.29:46158
#        X-Forwarded-For: 10.42.0.1
#
#    So the gate is `github-auth`, the same forwardAuth that has been in front
#    of the admin surface for fifty-five days. It asks who you are instead of
#    where you came from, which is a question the rewrite cannot corrupt --
#    and it is reachable from a phone, which the tailnet gate was not.
#
#    `X-Robots-Tag` below is belt and braces rather than the control: a crawler
#    is stopped at the gate. It is here so that the day somebody opens the host
#    up, the noindex is already on it rather than being the thing they forgot.
#
# 2. WHERE ITS MAIL GOES -- a sink in this namespace, never a real mailbox.
#    `/api/email` relays real SMTP in prod. Preprod must not, and the cheapest
#    way to guarantee that is for it to have no credential that could: the
#    secret points SMTP at `mail:1025`, which is a Mailpit that accepts
#    anything and delivers nothing. The alternative -- an unroutable SMTP_HOST
#    -- costs nothing but leaves the contact form permanently 500ing, which
#    looks exactly like a real outage and makes the one path that most needs
#    rehearsing the one path preprod cannot show. ~20 MiB to be able to send a
#    test message and read it is worth it.
#    Read what it caught with:
#      kubectl -n preprod port-forward deploy/mail 8025:8025  # then :8025
#
# 3. WHERE ITS CONTENT LIVES -- its own CouchDB, with its own password.
#    The database name is hardcoded in the API (`portfolio_content` in
#    src/db/couch.ts), so "same server, different database" would have meant
#    changing the application to make an infrastructure decision, and would
#    have left preprod holding a credential that can reach the production
#    store. A separate CouchDB in this namespace costs ~100 MiB and makes the
#    requirement structural: preprod has no route to the prod database and no
#    password for it. Seeding it is in the README.
#
# Everything here is applied by hand, like the rest of k8s/. CI only ever
# patches the image on `web` and `api`; see ci-rollout-rbac.yaml for exactly
# how much it is allowed to do in this namespace.
#
#   ./k8s/portfolio-apply.sh preprod    # once it has run, plain
#                                       # `kubectl apply -f` is safe too
#   ./k8s/preprod-secrets.sh            # the two secrets this expects
#
apiVersion: v1
kind: Namespace
metadata: {name: preprod}
---
# Response headers, not a gate. See (1) in the header: the gate is the
# `github-auth` gate, and this is what keeps a crawler out of the index
# on the day the gate is relaxed and nobody remembers this file.
# Identity, not an address.
#
# This was an `ipAllowList` on 100.64.0.0/10, copied from `git.` and
# `couchdb.`, and it could never have worked on this cluster. k3s's ServiceLB
# masquerades every inbound connection, so what Traefik receives is a cluster
# address and never the client's. Measured with a throwaway `whoami` behind
# this same Ingress, from a laptop sitting at 100.108.35.26 on the tailnet:
#
#     RemoteAddr:      10.42.0.29:46158
#     X-Forwarded-For: 10.42.0.1
#
# 10.42.0.1 is the node gateway. No tailnet range will ever match it, which is
# why this host, `git.` and `couchdb.` all returned 403 to everyone. The same
# measurement is why widening the range would be the wrong repair: every
# request arrives as 10.42.0.1, so admitting it admits the whole internet.
#
# forwardAuth survives the rewrite because it asks who you are rather than
# where you came from, and this exact middleware has been gating the admin
# surface for fifty-five days. The cluster-wide fix for the allowlist — Traefik
# on hostNetwork so it sees real client addresses — restarts the production
# ingress and is a separate, scheduled change.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: github-auth, namespace: preprod}
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
# Remove anything the CLIENT claims about itself, before github-auth answers
# who it really is. Without this a request could arrive carrying its own
# X-Auth-Request-User. Same shape as prod's in k8s/admin-gate.template.yaml.
#
# Why preprod needs the admin gate at all: the API's /api/admin requires the
# X-Admin-Proxy-Secret proof AND the expected login (requireAdmin.ts). Preprod
# had github-auth on the host but never stamped the proof, so /admin loaded and
# every admin call answered 401: the admin area could not be used on preprod.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: strip-identity, namespace: preprod}
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
      X-Admin-Proxy-Secret: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: noindex, namespace: preprod}
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow, noarchive"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: preprod}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: web
          # No `image:` on purpose: CI owns it, exactly as in prod (#25). Until
          # 2026-11-04 this said `:latest`, and an apply of this file swapped
          # the `main` digest CI had deployed for the last release. Now an
          # apply leaves the image alone. A missing Deployment is created by
          # `./k8s/portfolio-apply.sh preprod`; the header of portfolio.yaml
          # has the measured details.
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            # The API's host, fully qualified, and the qualification is the
            # entire reason this variable exists.
            #
            # nginx.conf.template proxies every /api/ request and all four
            # rendered SEO routes through one `set $api_upstream` line,
            # resolved per request by `resolver`. nginx takes nameservers from
            # /etc/resolv.conf and ignores its `search` list entirely, so the
            # bare Service name `api` is looked up as an absolute name, has no
            # record, and every /api/ request answers 502 with
            # `api could not be resolved (3: Host not found)`. A shell in this
            # pod resolves `api` because libc appends the search domains;
            # nginx never does. Measured here before the fix: 502 through
            # nginx against 200 for the identical path straight at the api
            # Service, with this pod's resolv.conf reading
            #   search preprod.svc.cluster.local svc.cluster.local ...
            #
            # The image defaults this to `api`, which is correct under Docker
            # Compose and wrong here, so it is set per namespace rather than
            # baked in. This is also the one line in this file where copying
            # from the prod manifest is actively dangerous: `.prod.` here
            # would point preprod's frontend at the production API, which is
            # exactly the isolation note (3) in the header exists to keep.
            - {name: NGINX_API_HOST, value: api.preprod.svc.cluster.local}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits:   {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: preprod}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: preprod}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: api
          # No `image:` on purpose; CI owns it. See `web` above.
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          envFrom:
            # Everything except the CouchDB credential. `preprod-secrets.sh`
            # creates it; its keys are listed there.
            - secretRef: {name: portfolio-api-env}
            # The CouchDB user and password, from the one secret the CouchDB
            # container below also reads. Two copies of a password in two
            # secrets is two things to keep in step, and the failure when they
            # drift is a 401 at the data layer that looks like the store being
            # down. `envFrom` is ordered, so this one wins if both set a key.
            - secretRef: {name: preprod-couch}
          env:
            - {name: NODE_ENV, value: production}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits:   {memory: 512Mi}
---
# The name "api" is load-bearing here exactly as it is in prod: the frontend's
# nginx.conf proxies /api/ to port 5000 on it, resolved per request through
# kube-dns in this namespace. The frontend asks for the fully-qualified name
# `api.preprod.svc.cluster.local` rather than a bare `api`, because nginx's
# resolver has no search list — see NGINX_API_HOST on the web Deployment above.
# Renaming this Service, or moving it, therefore means changing that variable
# in step with it.
apiVersion: v1
kind: Service
metadata: {name: api, namespace: preprod}
spec:
  selector: {app: api}
  ports: [{port: 5000, targetPort: 5000}]
---
# Preprod's own content store. See (3) in the header for why it is a second
# CouchDB rather than a second database on the production one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: couch-data, namespace: preprod}
spec:
  accessModes: [ReadWriteOnce]
  # Fixture content and whatever gets replicated in to look at. The production
  # store is on a 10Gi claim; this one does not need to be, and the block
  # storage it comes out of (local-path, on the boot volume) is shared with
  # everything else on the node.
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: couch, namespace: preprod}
spec:
  replicas: 1
  # Recreate, not RollingUpdate. The claim is ReadWriteOnce and a rolling
  # update starts the new pod before stopping the old one, so the new pod
  # waits for a volume the old pod still holds and the rollout sits there
  # until it times out.
  strategy: {type: Recreate}
  selector: {matchLabels: {app: couch}}
  template:
    metadata: {labels: {app: couch}}
    spec:
      containers:
        - name: couch
          # The same image and the same two environment variables the local
          # dev overlay uses, so a store that works locally works here.
          image: couchdb:3.4
          ports: [{containerPort: 5984}]
          envFrom:
            - secretRef: {name: preprod-couch}
          volumeMounts:
            - {name: data, mountPath: /opt/couchdb/data}
          resources:
            # The production CouchDB sits at ~100 MiB resident with the site's
            # content in it. 128Mi requested, 512Mi ceiling so a compaction or
            # a replication in does not get OOM-killed halfway.
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /_up, port: 5984}
            initialDelaySeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: couch-data}
---
apiVersion: v1
kind: Service
metadata: {name: couch, namespace: preprod}
spec:
  selector: {app: couch}
  ports: [{port: 5984, targetPort: 5984}]
---
# The mail sink. See (2) in the header.
#
# No Ingress and no ServiceAccount: it holds every message preprod's contact
# form has ever "sent", including whatever an operator typed into it, and the
# way to read that is a port-forward from a machine already on the tailnet
# rather than a seventh public hostname.
apiVersion: apps/v1
kind: Deployment
metadata: {name: mail, namespace: preprod}
spec:
  replicas: 1
  selector: {matchLabels: {app: mail}}
  template:
    metadata: {labels: {app: mail}}
    spec:
      containers:
        - name: mail
          image: axllent/mailpit:v1.21
          ports:
            - {containerPort: 1025, name: smtp}
            - {containerPort: 8025, name: ui}
          env:
            # nodemailer is always configured with an auth block, and if the
            # server does not advertise AUTH it will happily send anyway -- but
            # "happily" depends on the version, and a sink that rejects the
            # login is a data-layer-looking failure in the one place this
            # namespace exists to rehearse. Accept any credential instead, and
            # accept it without TLS, which is what a cluster-internal hop is.
            - {name: MP_SMTP_AUTH_ACCEPT_ANY, value: "true"}
            - {name: MP_SMTP_AUTH_ALLOW_INSECURE, value: "true"}
            # No volume: the store is in-memory and a restart loses it. These
            # are test messages, and a ring buffer that cannot grow is the
            # point on a node with 12 GB for everything.
            - {name: MP_MAX_MESSAGES, value: "200"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: mail, namespace: preprod}
spec:
  selector: {app: mail}
  ports:
    - {name: smtp, port: 1025, targetPort: 1025}
    - {name: ui, port: 8025, targetPort: 8025}
---
# One host, and it is not public. `preprod.yehudabriskman.com` must be a
# Cloudflare A record to the node's *tailnet* address (100.79.242.82),
# DNS-only, exactly as `git.` and `couchdb.` are -- the wildcard record points
# at the public IP, and with the allowlist on, a request arriving there has a
# public source address and is refused. TLS needs nothing: the wildcard
# certificate in kube-system is Traefik's default and already covers this name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: preprod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Order matters only in that the allowlist should reject before anything
    # else runs. Middlewares are namespaced, hence the `preprod-` prefix.
    # The admin gate's three, in prod's order (k8s/admin-gate.template.yaml),
    # then the noindex. `preprod-inject-proxy-secret` is NOT in this file: it
    # carries the secret, so k8s/preprod-admin-gate.sh renders it from the
    # namespace's own portfolio-api-env and applies it. Run that script before
    # applying this file, or Traefik refuses the router for a missing middleware.
    traefik.ingress.kubernetes.io/router.middlewares: >-
      preprod-strip-identity@kubernetescrd,preprod-github-auth@kubernetescrd,preprod-inject-proxy-secret@kubernetescrd,preprod-noindex@kubernetescrd
spec:
  rules:
    - host: preprod.yehudabriskman.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
